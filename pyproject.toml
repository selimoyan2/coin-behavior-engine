[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coin-behavior-engine"
version = "0.1.0"
description = "Cryptocurrency market behavior research and decision-support engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Coin Behavior Engine Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
cbe = "coin_behavior_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coin_behavior_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
